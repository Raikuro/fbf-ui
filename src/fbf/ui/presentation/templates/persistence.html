{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">SQLite Persistence Browser</h1>
    <p class="page-description">Browse and inspect historical experiments stored in local SQLite databases</p>
</div>

<div class="card">
    <h2 class="card-title">Experiments</h2>
    <div id="experiments-container">
        <p class="text-muted">Loading experiments...</p>
    </div>
</div>

<script>
async function loadExperiments() {
    const container = document.getElementById('experiments-container');
    try {
        const response = await fetch('/api/v1/persistence/experiments');
        const experiments = await response.json();

        if (experiments.length === 0) {
            container.innerHTML = '<p class="text-muted">No experiments found. Run a study to create persisted experiments.</p>';
            return;
        }

        let html = '<table class="data-table">';
        html += '<thead><tr>';
        html += '<th>Name</th>';
        html += '<th>Revision</th>';
        html += '<th>Dataset</th>';
        html += '<th>Status</th>';
        html += '<th>Units</th>';
        html += '<th>Created</th>';
        html += '<th></th>';
        html += '</tr></thead>';
        html += '<tbody>';

        for (const exp of experiments) {
            const statusClass = exp.status === 'completed' ? 'status-completed' :
                               exp.status === 'failed' ? 'status-failed' :
                               exp.status === 'executing' ? 'status-executing' : 'status-pending';
            const createdDate = exp.created_at ? exp.created_at.substring(0, 10) : '-';
            html += '<tr>';
            html += '<td>' + escapeHtml(exp.name) + '</td>';
            html += '<td>' + escapeHtml(exp.revision) + '</td>';
            html += '<td>' + escapeHtml(exp.dataset_identifier) + '</td>';
            html += '<td><span class="status-badge ' + statusClass + '">' + escapeHtml(exp.status || 'pending') + '</span></td>';
            html += '<td>' + (exp.unit_count != null ? exp.unit_count : '-') + '</td>';
            html += '<td>' + createdDate + '</td>';
            html += '<td><a href="/persistence/experiments/' + exp.experiment_id + '" class="link-button">View</a></td>';
            html += '</tr>';
        }

        html += '</tbody></table>';
        container.innerHTML = html;
    } catch (error) {
        container.innerHTML = '<p class="text-muted">Failed to load experiments. Check that the database is accessible.</p>';
    }
}

function escapeHtml(text) {
    if (text == null) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

loadExperiments();
</script>

<style>
.data-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 0.5rem;
}
.data-table th,
.data-table td {
    padding: 0.6rem 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
}
.data-table th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.data-table tbody tr:hover {
    background-color: rgba(255, 255, 255, 0.03);
}
.status-badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 0.25rem;
    font-size: 0.8rem;
    font-weight: 500;
}
.status-completed {
    background-color: rgba(34, 197, 94, 0.15);
    color: #22c55e;
}
.status-failed {
    background-color: rgba(239, 68, 68, 0.15);
    color: #ef4444;
}
.status-executing {
    background-color: rgba(56, 189, 248, 0.15);
    color: #38bdf8;
}
.status-pending {
    background-color: rgba(148, 163, 184, 0.15);
    color: #94a3b8;
}
.link-button {
    color: var(--accent-blue);
    text-decoration: none;
    font-size: 0.85rem;
}
.link-button:hover {
    text-decoration: underline;
}
.text-muted {
    color: var(--text-muted);
}
</style>
{% endblock %}
